# =====================================================================
# Alert-client "match-incidents" — Deployment manifest (reference)
# =====================================================================
# Environnement cible : Serverless Container (cns-alert-client) + CRON trigger
#   - Container image : rg.fr-par.scw.cloud/rg-alert-client/match-incidents:latest
#   - Arch            : linux/amd64 (obligatoire sur Scaleway)
#   - Port / protocole: 8080 / http1
#   - Scale to zero   : min-scale=0, max-scale=1
#   - Timeout         : 300s
#   - Private Network : pn-alert-client (accès au RDB privé 10.11.0.2:5432)
#   - CRON            : */15 * * * *
# =====================================================================
name: match-incidents
schedule: '*/15 * * * *'   # CRON trigger du container (toutes les 15 minutes)
timeout: 300  # 5 minutes

# NOTE IMPORTANTE : un Serverless Container n'a ni "runtime" ni "handler"
# (contrairement aux Serverless Jobs). Il expose un listener HTTP (server.py,
# port 8080) que le CRON invoke ; chaque appel exécute main.main() une fois et
# remonte rc via le code HTTP de la réponse (200 si rc=0, 500 sinon).

environment:
  INCIDENT_API_URL: https://incresponse.incre.prd.fr-par.internal.scaleway.com/core/incidents/
  CONSOLE_API_URL: https://api.scaleway.com/resource-private/v1alpha1/dashboard

# Secrets montés dans le container (Secret Manager) -> env vars
# ATTENTION aux NOMS EXACTS des secrets dans Secret Manager :
#   - alert-client-database-url  -> DATABASE_URL
#   - alert-client-scaleway-key  -> SCALEWAY_API_KEY
# Le secret alert-client-access-key (ACCESS key id) n'est PAS monté dans le
# container : il documente l'identifiant de la clé utilisée par le cron.
secrets:
  - key: SCALEWAY_API_KEY
    name: alert-client-scaleway-key
  - key: DATABASE_URL
    name: alert-client-database-url

# Note: The API key should have READ-ONLY permissions only
# It should NOT have write/delete permissions on any Scaleway resources
# Recommended IAM policy:
# - resource: resource_private.v1alpha1.ConsoleApi
#   permissions: [get]
# - resource: organizations
#   permissions: [read]